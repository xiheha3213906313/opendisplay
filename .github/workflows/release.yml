name: Release

on:
  push:
    branches: [main]
  # Recover missing artifacts for an existing GitHub release.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. v1.26.0
        required: true
      update_main:
        description: Commit the Arch PKGBUILDs to main.
        type: boolean
        required: false
        default: false
      rebuild_linux:
        description: Rebuild and re-upload the Linux release assets. Leave false to keep assets already on the release.
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

# Serialize publication across refs, including a manual recovery of a push release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.rp.outputs.release_created || steps.rp2.outputs.release_created || steps.rp3.outputs.release_created }}
      tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.rp.outputs.tag_name || steps.rp2.outputs.tag_name || steps.rp3.outputs.tag_name }}
      mac_sender_exists: ${{ steps.assets.outputs.mac_sender_exists }}
      mac_receiver_exists: ${{ steps.assets.outputs.mac_receiver_exists }}
      android_apk_exists: ${{ steps.assets.outputs.android_apk_exists }}
      android_checksum_exists: ${{ steps.assets.outputs.android_checksum_exists }}
    steps:
      # Manifest mode (release-please-config.json, .release-please-manifest.json)
      # only to bump linux/Cargo.toml and linux/Cargo.lock with the app
      # version: one `simple` package at the root, tags stay `vX.Y.Z`.
      #
      # GitHub's GraphQL API intermittently answers release-please's commit
      # query with "Something went wrong while executing your query" (seen
      # after the large #298 merge). Retry twice; a release that was created
      # before a failure is picked up as already tagged, so its builds would
      # be skipped: rebuild it with the workflow_dispatch entry below.
      # skip-github-pull-request: Actions on this fork cannot open pull
      # requests (run 45418376350). With no GitHub Release, that attempt
      # rewrote history as 1.12.0. Creating the release from a merged
      # release PR still runs. bootstrap-sha pins the previous release at
      # v1.30.3 so the next version is computed from that commit.
      - uses: googleapis/release-please-action@v5
        if: github.event_name == 'push'
        id: rp
        continue-on-error: true
        with:
          skip-github-pull-request: true
      - if: github.event_name == 'push' && steps.rp.outcome == 'failure'
        run: sleep 30
      - uses: googleapis/release-please-action@v5
        if: github.event_name == 'push' && steps.rp.outcome == 'failure'
        id: rp2
        continue-on-error: true
        with:
          skip-github-pull-request: true
      - if: github.event_name == 'push' && steps.rp2.outcome == 'failure'
        run: sleep 60
      - uses: googleapis/release-please-action@v5
        if: github.event_name == 'push' && steps.rp2.outcome == 'failure'
        id: rp3
        with:
          skip-github-pull-request: true
      - name: Check which release assets are already uploaded
        id: assets
        if: github.event_name == 'workflow_dispatch' || steps.rp.outputs.release_created == 'true' || steps.rp2.outputs.release_created == 'true' || steps.rp3.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.rp.outputs.tag_name || steps.rp2.outputs.tag_name || steps.rp3.outputs.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a vX.Y.Z tag: $TAG"; exit 1; }
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | select(.state == "uploaded") | .name')
          asset_exists() {
            local name="$1" output="$2"
            if grep -Fxq -- "$name" <<< "$assets"; then
              echo "$output=true" >> "$GITHUB_OUTPUT"
            else
              echo "$output=false" >> "$GITHUB_OUTPUT"
            fi
          }
          asset_exists OpenDisplay.dmg mac_sender_exists
          asset_exists OpenDisplayReceiver.dmg mac_receiver_exists
          asset_exists OpenDisplay-Android.apk android_apk_exists
          asset_exists OpenDisplay-Android.apk.sha256 android_checksum_exists

  # Linux sender tarballs and receiver Flatpak bundles, attached to the same
  # GitHub release; the job also appends the Linux install notes to it. One
  # version for every platform: the tag above is the Linux version too.
  # A manual rebuild leaves the published Linux assets in place unless
  # rebuild_linux is set. Push releases still attach them.
  build-linux:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && (github.event_name != 'workflow_dispatch' || inputs.rebuild_linux == true)
    # The called workflow's upload job needs to write the release.
    permissions:
      contents: write
    uses: ./.github/workflows/linux-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # Points the Arch PKGBUILDs on main at the new tag; see arch-bump.yml.
  # A manual run does not commit to main unless update_main is set.
  bump-arch:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && (github.event_name != 'workflow_dispatch' || inputs.update_main == true)
    permissions:
      contents: write
    uses: ./.github/workflows/arch-bump.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # The fork distributes macOS disk images without Developer ID notarization.
  build-mac:
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      (needs.release-please.outputs.mac_sender_exists != 'true' ||
       needs.release-please.outputs.mac_receiver_exists != 'true')
    runs-on: macos-26
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      APP_BUILD_NUMBER: ${{ github.run_number }}
      SENDER_EXISTS: ${{ needs.release-please.outputs.mac_sender_exists }}
      RECEIVER_EXISTS: ${{ needs.release-please.outputs.mac_receiver_exists }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check out macOS release tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .mac-release-tools
          sparse-checkout: tools/dmg
          persist-credentials: false

      - name: Install build dependencies
        run: |
          brew install xcodegen cmake
          python -m pip install dmgbuild==2.0.0

      - name: Generate project
        run: xcodegen generate

      - name: Build and upload missing macOS disk images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          mkdir -p build/export

          build_and_upload() {
            local scheme="$1" derived="$2" app_name="$3" asset="$4" entitlements="$5"
            xcodebuild build \
              -project OpenSidecar.xcodeproj \
              -scheme "$scheme" \
              -configuration Release \
              -destination 'platform=macOS' \
              -derivedDataPath "$derived" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              "MARKETING_VERSION=${version}" \
              "CURRENT_PROJECT_VERSION=${APP_BUILD_NUMBER}"
            local app="$derived/Build/Products/Release/$app_name.app"
            lipo "$app/Contents/MacOS/$app_name" -verify_arch arm64
            lipo "$app/Contents/MacOS/$app_name" -verify_arch x86_64
            codesign --force --sign - --entitlements "$entitlements" "$app"
            codesign --verify --deep --strict "$app"
            bash .mac-release-tools/tools/dmg/build.sh "$app" "build/export/$asset"
            gh release upload "$TAG_NAME" "build/export/$asset"
          }

          if [[ "$SENDER_EXISTS" != true ]]; then
            build_and_upload OpenSidecarMac build/sender OpenDisplay OpenDisplay.dmg \
              Mac/OpenSidecarMac.entitlements
          fi
          if [[ "$RECEIVER_EXISTS" != true ]]; then
            build_and_upload OpenSidecarMacReceiver build/receiver "OpenDisplay Receiver" OpenDisplayReceiver.dmg \
              MacReceiver/OpenSidecarMacReceiver.entitlements
          fi

  publish-mac-downloads:
    needs: [release-please, build-mac]
    if: >-
      ${{ always() && !cancelled() &&
          github.repository == 'xiheha3213906313/opendisplay' &&
          needs.release-please.outputs.release_created == 'true' &&
          (needs.build-mac.result == 'success' || needs.build-mac.result == 'skipped') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
      - name: Publish Mac installers to main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: bash tools/updates/publish-mac-downloads.sh "$TAG_NAME"

  # Sign new APKs with the fork's existing signing helper.
  build-android:
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      (needs.release-please.outputs.android_apk_exists != 'true' ||
       needs.release-please.outputs.android_checksum_exists != 'true')
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      APK_EXISTS: ${{ needs.release-please.outputs.android_apk_exists }}
      CHECKSUM_EXISTS: ${{ needs.release-please.outputs.android_checksum_exists }}
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v6
        if: env.APK_EXISTS != 'true'
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-java@v5
        if: env.APK_EXISTS != 'true'
        with:
          distribution: temurin
          java-version: 17

      # Derive both Android version fields from the release tag.
      - name: Build release APK (unsigned)
        if: env.APK_EXISTS != 'true'
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 ))
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName="$VERSION" -PappVersionCode="$CODE"

      # Older tags predate the signing helper. Use the workflow's own revision
      # for release tooling and the tag checkout for the app being signed.
      - name: Check out APK signing tools
        if: env.APK_EXISTS != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: Android/release-keystore
          persist-credentials: false

      - name: Sign APK
        if: env.APK_EXISTS != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bash ../.release-tools/Android/release-keystore/sign-release-apk.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            dist/OpenDisplay-Android.apk

      - name: Upload APK and checksum
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk=OpenDisplay-Android.apk
          dist="$RUNNER_TEMP/android-release"
          mkdir -p "$dist"
          if [[ "$APK_EXISTS" == true ]]; then
            gh release download "$TAG_NAME" --pattern "$apk" --dir "$dist"
          else
            cp "Android/dist/$apk" "$dist/$apk"
          fi
          cd "$dist"
          sha256sum "$apk" > "$apk.sha256"
          if [[ "$CHECKSUM_EXISTS" == true ]]; then
            # Replace an orphan checksum before publishing its matching APK.
            gh release upload "$TAG_NAME" "$apk.sha256" --clobber
          else
            gh release upload "$TAG_NAME" "$apk.sha256"
          fi
          if [[ "$APK_EXISTS" != true ]]; then
            gh release upload "$TAG_NAME" "$apk"
          fi
